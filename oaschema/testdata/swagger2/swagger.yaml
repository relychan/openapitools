swagger: "2.0"
info:
  title: Swagger 2 Regression
  version: "1.0.0"
basePath: /api/v1
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  oauth:
    type: oauth2
    flow: application
    tokenUrl: https://example.com/token
paths:
  /items:
    get:
      operationId: listItems
      parameters:
        - name: tags
          in: query
          type: array
          minItems: 1
          items:
            type: string
            minLength: 3
            maxLength: 10
        - name: q
          in: query
          type: string
          minLength: 2
      responses:
        "200":
          description: ok
          headers:
            X-Token:
              type: string
              minLength: 4
            X-Rate-Limit:
              type: integer
              minimum: 1
          schema:
            type: array
            items:
              type: string
  /upload:
    post:
      operationId: upload
      consumes:
        - multipart/form-data
      parameters:
        - name: file
          in: formData
          type: file
      responses:
        "204":
          description: no content
